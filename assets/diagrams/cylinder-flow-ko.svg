<svg xmlns="http://www.w3.org/2000/svg" width="600" height="670" viewBox="0 0 600 670" role="img" aria-labelledby="title desc"><title id="title">Cylinder</title><desc id="desc">담당 구현 흐름. 탐색과 상호작용 → 대화 노드 읽기 → 선택지와 조건 → 명령과 화면 전환 → 아이템 수집과 등록 → 도서관과 슬라이더 퍼즐</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#637487"/></marker></defs><rect width="600" height="100%" rx="20" fill="#f4f7fa"/><rect x="26" y="27" width="5" height="50" rx="2" fill="#166b52"/><text x="45" y="47" fill="#152536" font-size="25" font-weight="700" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">Cylinder</text><text x="45" y="76" fill="#53677b" font-size="19" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">담당 구현 흐름</text><path d="M280 187 H314" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M447 259 V288" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320 367 H286" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M153 439 V468" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 547 H314" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="115" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="44" y="144" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">01</text><text x="44" y="174" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">탐색과 상호작용</text><rect x="320" y="115" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="338" y="144" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">02</text><text x="338" y="174" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">대화 노드 읽기</text><rect x="320" y="295" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="338" y="324" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">03</text><text x="338" y="354" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">선택지와 조건</text><rect x="26" y="295" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="44" y="324" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">04</text><text x="44" y="354" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">명령과 화면 전환</text><rect x="26" y="475" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="44" y="504" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">05</text><text x="44" y="534" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">아이템 수집과</text><text x="44" y="561" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">등록</text><rect x="320" y="475" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="338" y="504" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">06</text><text x="338" y="534" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">도서관과 슬라이더</text><text x="338" y="561" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">퍼즐</text></svg>