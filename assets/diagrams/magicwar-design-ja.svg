<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880" role="img" aria-labelledby="title desc"><title id="title">Arcana Duel</title><desc id="desc">デッキ交換と画面更新. カードとスロット選択 → 交換要求を送信 → 成功: デッキ再読込 → 失敗: ログ記録 → 装備カードを受信 → デッキスロット更新</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#637487"/></marker></defs><rect width="600" height="100%" rx="20" fill="#f4f7fa"/><rect x="26" y="27" width="5" height="50" rx="2" fill="#915526"/><text x="45" y="47" fill="#152536" font-size="25" font-weight="700" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">Arcana Duel</text><text x="45" y="76" fill="#53677b" font-size="19" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">デッキ交換と画面更新</text><path d="M300 210 V238" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 345 V380 H153 V408" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 380 H447 V408" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="372" text-anchor="middle" fill="#42566c" font-size="18" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">サーバー応答</text><path d="M153 550 V570 H300 V588" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 695 V723" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="110" width="280" height="100" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="178" y="139" font-size="17" font-weight="700" fill="#915526" font-family="Segoe UI,sans-serif">INPUT</text><text x="178" y="169" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">カードとスロット選</text><text x="178" y="196" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">択</text><rect x="160" y="245" width="280" height="100" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="178" y="274" font-size="17" font-weight="700" fill="#915526" font-family="Segoe UI,sans-serif">REQUEST</text><text x="178" y="304" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">交換要求を送信</text><rect x="26" y="415" width="254" height="135" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="44" y="444" font-size="17" font-weight="700" fill="#915526" font-family="Segoe UI,sans-serif">A</text><text x="44" y="474" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">成功:</text><text x="44" y="501" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">デッキ再読込</text><rect x="320" y="415" width="254" height="135" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="338" y="444" font-size="17" font-weight="700" fill="#915526" font-family="Segoe UI,sans-serif">B</text><text x="338" y="474" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">失敗: ログ記録</text><rect x="160" y="595" width="280" height="100" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="178" y="624" font-size="17" font-weight="700" fill="#915526" font-family="Segoe UI,sans-serif">STATE</text><text x="178" y="654" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">装備カードを受信</text><rect x="160" y="730" width="280" height="125" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="178" y="759" font-size="17" font-weight="700" fill="#915526" font-family="Segoe UI,sans-serif">VIEW</text><text x="178" y="789" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">デッキスロット更新</text></svg>