<svg xmlns="http://www.w3.org/2000/svg" width="600" height="670" viewBox="0 0 600 670" role="img" aria-labelledby="title desc"><title id="title">DeathGuider</title><desc id="desc">담당 구현 흐름. 유닛 모집 → 유닛 보관과 선택 → 훈련과 회복 → 연구와 장비 제작 → 파티와 장비 편성 → 전투 진입 조건 확인</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#637487"/></marker></defs><rect width="600" height="100%" rx="20" fill="#f4f7fa"/><rect x="26" y="27" width="5" height="50" rx="2" fill="#166b52"/><text x="45" y="47" fill="#152536" font-size="25" font-weight="700" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">DeathGuider</text><text x="45" y="76" fill="#53677b" font-size="19" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">담당 구현 흐름</text><path d="M280 187 H314" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M447 259 V288" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320 367 H286" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M153 439 V468" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 547 H314" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="115" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="44" y="144" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">01</text><text x="44" y="174" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">유닛 모집</text><rect x="320" y="115" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="338" y="144" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">02</text><text x="338" y="174" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">유닛 보관과 선택</text>