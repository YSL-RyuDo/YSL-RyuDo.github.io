<svg xmlns="http://www.w3.org/2000/svg" width="600" height="670" viewBox="0 0 600 670" role="img" aria-labelledby="title desc"><title id="title">DeathGuider</title><desc id="desc">担当実装の流れ. ユニット募集 → ユニット保管と選択 → 訓練と回復 → 研究と装備制作 → パーティーと装備編成 → 戦闘開始条件の確認</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#637487"/></marker></defs><rect width="600" height="100%" rx="20" fill="#f4f7fa"/><rect x="26" y="27" width="5" height="50" rx="2" fill="#166b52"/><text x="45" y="47" fill="#152536" font-size="25" font-weight="700" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">DeathGuider</text><text x="45" y="76" fill="#53677b" font-size="19" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">担当実装の流れ</text><path d="M280 187 H314" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M447 259 V288" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320 367 H286" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M153 439 V468" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 547 H314" fill="none" stroke="#637487" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="115" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="44" y="144" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">01</text><text x="44" y="174" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">ユニット募集</text><rect x="320" y="115" width="254" height="144" rx="14" fill="#fff" stroke="#cbd6e0"/><text x="338" y="144" font-size="17" font-weight="700" fill="#166b52" font-family="Segoe UI,sans-serif">02</text><text x="338" y="174" fill="#152536" font-size="23" font-weight="600" font-family="Segoe UI,Malgun Gothic,Yu Gothic,sans-serif">ユニット保管と選</text><text